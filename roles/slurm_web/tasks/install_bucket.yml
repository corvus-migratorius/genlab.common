---
- name: Set package base URL
  ansible.builtin.set_fact:
    slurm_web_base_url: >-
      https://storage.yandexcloud.net/role-packages/{{
        'slurm-web/debian' if ansible_os_family == 'Debian' else 'slurm-web/redhat'
      }}

- name: Create package directory
  ansible.builtin.file:
    path: /tmp/slurm-web-packages
    state: directory
    mode: "0755"

- name: List packages via S3 XML API
  ansible.builtin.uri:
    url: "https://storage.yandexcloud.net/role-packages?prefix={{ 'slurm-web/debian' if ansible_os_family == 'Debian' else 'slurm-web/redhat' }}&list-type=2"
    return_content: true
  register: slurm_web_s3_listing

- name: Extract package keys from S3 XML
  ansible.builtin.set_fact:
    slurm_web_packages: >-
      {{
        slurm_web_s3_listing.content
        | regex_findall('<Key>(slurm-web/' +
         ('debian' if ansible_os_family == 'Debian' else 'redhat') +
          '/[^<]+\.' + ('deb' if ansible_os_family == 'Debian' else
      'rpm') + ')</Key>')
      }}

- name: Download packages
  ansible.builtin.get_url:
    url: "https://storage.yandexcloud.net/role-packages/{{ item | replace('%', '%25') }}"
    dest: "/tmp/slurm-web-packages/{{ item | basename }}"
    mode: "0644"
  loop: "{{ slurm_web_packages }}"

- name: Install all packages in one transaction via shell
  ansible.builtin.shell: "apt-get install -y /tmp/slurm-web-packages/*.deb"
  when: ansible_os_family == 'Debian'
  register: pkg_result
  changed_when: "'0 upgraded, 0 newly installed' not in pkg_result.stdout"
  tags:
    - skip_ansible_lint

- name: Get list of RPM files to install
  ansible.builtin.find:
    paths: "/tmp/slurm-web-packages/"
    patterns: "*.rpm"
  register: slurm_web_rpm_list
  when: ansible_os_family == 'RedHat'

- name: Install all RPM packages at once
  ansible.builtin.dnf:
    name: "{{ slurm_web_rpm_list.files | map(attribute='path') | list }}"
    disable_gpg_check: true
    state: present
  when:
    - ansible_os_family == 'RedHat'
