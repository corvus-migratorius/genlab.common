---
- name: Verify
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: "Include default vars"
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions: ["yml"]

    - name: "Check if cgrpuser-exporter is installed"
      changed_when: false
      ansible.builtin.command: "cgrpuser-exporter --version"
      register: cgrpuser_exporter_installed_version

    - name: "Check cgrpuser-exporter version"
      ansible.builtin.assert:
        that: "cgrpuser_exporter_installed_version.stdout is regex('{{ cgrpuser_exporter_ver }}')"
        success_msg: "cgrpuser-exporter version {{ cgrpuser_exporter_ver }} is installed and working"
        fail_msg: "cgrpuser-exporter version {{ cgrpuser_exporter_ver }} is not installed or not working correctly"

    - name: Wait for 15 seconds
      ansible.builtin.pause:
        seconds: 15

    - name: "DEBUG: service status"
      ansible.builtin.command: systemctl status cgrpuser-exporter --no-pager -l
      changed_when: false
      failed_when: false
      register: svc_status

    - name: "DEBUG: journal"
      ansible.builtin.command: journalctl -u cgrpuser-exporter --no-pager -n 60
      changed_when: false
      failed_when: false
      register: svc_journal

    - name: "DEBUG: user.slice contents"
      ansible.builtin.shell: "ls -la /sys/fs/cgroup/user.slice/ 2>&1; true"
      changed_when: false
      register: user_slice

    - name: "DEBUG: print"
      ansible.builtin.debug:
        msg: "{{ svc_status.stdout_lines + svc_status.stderr_lines + svc_journal.stdout_lines + user_slice.stdout_lines }}"

    - name: Check that service is up
      ansible.builtin.uri:
        url: "http://0.0.0.0:{{ cgrpuser_exporter_port }}/metrics"
        status_code: 200
      register: metrics
      retries: 5
      delay: 3
      until: metrics.status == 200

    - name: "Check that service is up and giving sane responses"
      changed_when: false
      register: cgrpuser_exporter_this
      until: cgrpuser_exporter_this is ansible.builtin.success
      retries: 5
      failed_when: "cgrpuser_exporter_this is ansible.builtin.failed or 'cgrpuser_exporter_memory_current' not in cgrpuser_exporter_this.content"
      ansible.builtin.uri:
        # kics-scan ignore-line
        url: "http://localhost:{{ cgrpuser_exporter_port }}/metrics"
        status_code: 200
        return_content: true
