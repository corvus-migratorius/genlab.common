---
# kics-scan disable=2e8d4922-8362-4606-8c14-aa10466a1ce3

- name: "Install the 'ping_exporter' package from Github (Debian)"
  tags: ping_exporter
  when: ansible_os_family == "Debian"
  notify: "Restart-ping-exporter"
  vars:
    version: "{{ ping_exporter_version }}"
    base_url: "https://github.com/czerwonk/ping_exporter/releases/download"
    full_url: "{{ base_url }}/v{{ version }}/ping_exporter_{{ version }}_linux_amd64.deb"
  ansible.builtin.apt:
    deb: "{{ full_url }}"
    state: present

- name: "Install the 'ping_exporter' package from Github (RedHat)"
  tags: ping_exporter
  when: ansible_os_family == "RedHat"
  notify: "Restart-ping-exporter"
  vars:
    version: "{{ ping_exporter_version }}"
    base_url: "https://github.com/czerwonk/ping_exporter/releases/download"
    full_url: "{{ base_url }}/v{{ version }}/ping_exporter_{{ version }}_linux_amd64.rpm"
  ansible.builtin.dnf:
    name: "{{ full_url }}"
    state: present
    disable_gpg_check: true

- name: "Create a ping_exporter user"
  tags: ping_exporter
  ansible.builtin.user:
    name: ping_exporter
    system: true

- name: "Ensure that the configuration folder exitsts"
  tags: ping_exporter
  ansible.builtin.file:
    state: directory
    path: /etc/ping_exporter.
    owner: ping_exporter
    group: root
    mode: "0755"

- name: "Push the configuration file"
  tags: ping_exporter
  notify: "Restart-ping-exporter"
  ansible.builtin.template:
    src: "config.yml.j2"
    dest: "/etc/ping_exporter/config.yml"
    owner: ping_exporter
    group: root
    mode: "0644"
