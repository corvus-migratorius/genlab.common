---
- name: "Restart-enable firewalld server"
  when: ovpn_server_manage_firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: restarted
    enabled: true
    daemon_reload: true

- name: "Restart-enable OpenVPN server"
  when: ovpn_server_start_service
  ansible.builtin.systemd_service:
    name: "{{ ovpn_server_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
