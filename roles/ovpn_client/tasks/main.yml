---
- name: "Install OpenVPN and the DNS handling helper tools"
  ansible.builtin.apt:
    name:
      - openvpn
      - openvpn-systemd-resolved
    state: present
    update_cache: true

- name: "Create OpenVPN client directory"
  ansible.builtin.file:
    path: "{{ ovpn_client_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "Install OpenVPN client profile"
  notify: "Restart-enable OpenVPN client"
  ansible.builtin.copy:
    dest: "{{ ovpn_client_config_path }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      client
      dev tun
      proto udp
      remote {{ ovpn_client_remote.address }}
      resolv-retry infinite
      nobind
      persist-key
      persist-tun

      dhcp-option DNS {{ ovpn_client_remote.dns }}
      dhcp-option DOMAIN {{ ovpn_client_remote.domain }}

      script-security 2
      up /etc/openvpn/update-systemd-resolved
      down /etc/openvpn/update-systemd-resolved
      down-pre

      <ca>
      {{ ovpn_client_ca_crt }}
      </ca>
      <tls-auth>
      {{ ovpn_client_tls_auth }}
      </tls-auth>

      remote-cert-tls server
      key-direction 1
      auth-user-pass {{ ovpn_client_auth_path }}
      auth-retry nointeract
      auth SHA512

      cipher AES-256-GCM
      tls-version-min 1.2

      verb 3

- name: "Install OpenVPN credentials"
  no_log: "{{ ovpn_client_no_log }}"
  diff: false
  notify: "Restart-enable OpenVPN client"
  ansible.builtin.copy:
    content: |
      {{ ovpn_client_username }}
      {{ ovpn_client_password }}
    dest: "{{ ovpn_client_auth_path }}"
    owner: root
    group: root
    mode: "0600"
