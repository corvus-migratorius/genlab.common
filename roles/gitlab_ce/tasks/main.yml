- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - perl
      - tzdata
      - openssl
      - unzip
    update_cache: true

- name: Install AWS CLI v2
  block:
    - name: Check for installed AWS CLI
      ansible.builtin.stat:
        path: /usr/local/bin/aws
      register: gitlab_ce_awscli_bin

    - name: Install AWS CLI v2 from official archive
      when: not gitlab_ce_awscli_bin.stat.exists
      block:
        - name: Download AWS CLI v2 installer
          ansible.builtin.get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-\
                  {{ ansible_facts['architecture'] }}.zip"
            dest: /tmp/awscliv2.zip
            mode: "0644"

        - name: Unpack AWS CLI v2 installer
          ansible.builtin.unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: true

        - name: Run AWS CLI v2 installer
          ansible.builtin.command: /tmp/aws/install
          changed_when: true
  always:
    - name: Clean up AWS CLI installer files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws

- name: Add GitLab repository
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh
    dest: /tmp/gitlab_script.deb.sh
    mode: '0755'

- name: Run script to install Gitlab repo
  ansible.builtin.command: /tmp/gitlab_script.deb.sh
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list

- name: Install GitLab CE
  ansible.builtin.apt:
    name: "gitlab-ce={{ gitlab_ce_version }}"
    update_cache: true
  retries: 3
  delay: 3
  register: gitlab_ce_result
  until: gitlab_ce_result is success

- name: Create SSL directory
  ansible.builtin.file:
    path: "{{ gitlab_ce_ssl_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render openssl config
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: "{{ gitlab_ce_ssl_dir }}/openssl.cnf"
    owner: root
    group: root
    mode: "0644"

- name: Generate self-signed certificate
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:4096 -nodes
    -keyout {{ gitlab_ce_ssl_dir }}/{{ gitlab_ce_fqdn }}.key
    -out {{ gitlab_ce_ssl_dir }}/{{ gitlab_ce_fqdn }}.crt
    -days {{ gitlab_ce_cert_days }}
    -config {{ gitlab_ce_ssl_dir }}/openssl.cnf
  args:
    creates: "{{ gitlab_ce_ssl_dir }}/{{ gitlab_ce_fqdn }}.crt"

- name: Protect private key
  ansible.builtin.file:
    path: "{{ gitlab_ce_ssl_dir }}/{{ gitlab_ce_fqdn }}.key"
    owner: root
    group: root
    mode: "0600"

- name: Configure gitlab.rb
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  notify: Reconfigure GitLab

- name: Apply configuration
  ansible.builtin.meta: flush_handlers

- name: Read initial root password
  ansible.builtin.slurp:
    src: /etc/gitlab/initial_root_password
  register: gitlab_ce_initial_root_password
  failed_when: false

- name: Show initial root password
  ansible.builtin.debug:
    msg: "{{ (gitlab_ce_initial_root_password.content | b64decode).split('\n') | select('match', '^Password:') | list | first }}"
