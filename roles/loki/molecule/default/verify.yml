---
- name: Verify
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # https://github.com/ansible/molecule/issues/3587#issuecomment-1158650179
    - name: "Include default vars"
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions: ['yml']

    - name: "Query the Loki service readiness endpoint"
      register: loki_ready
      retries: 60
      delay: 1
      until:
        - (loki_ready.status | default(-1)) == 200
        - (loki_ready.content | trim | default("")) == "ready"
      ansible.builtin.uri:
        # kics-scan ignore-line - HTTP usage
        url: "http://localhost:{{ loki_port }}/ready"
        method: GET
        status_code: 200
        return_content: true

    - name: "Get Loki running services status"
      register: loki_services
      ansible.builtin.uri:
        # kics-scan ignore-line - HTTP usage
        url: "http://localhost:{{ loki_port }}/services"
        method: GET
        status_code: 200
        return_content: true

    - name: "Assert all configured services are in the running state"
      loop:
        - cache-generation-loader
        - ring
        - rule-evaluator
        - compactor
        - distributor
        - query-scheduler-ring
        - query-frontend-tripperware
        - query-scheduler
        - querier
        - ruler
        - server
        - memberlist-kv
        - ingester-querier
        - ingester
        - query-frontend
        - store
      ansible.builtin.assert:
        that: "'{{ item }} => Running' in loki_services.content"
        success_msg: "OK: {{ item }}"
        fail_msg: "FAIL: {{ item }}"

    - name: "Sanity check the Loki daemon by scraping its metrics endpoint"
      retries: 5
      delay: 1
      register: loki_metrics
      failed_when: "loki_version not in loki_metrics.content"
      ansible.builtin.uri:
        # kics-scan ignore-line - HTTP usage
        url: "http://localhost:{{ loki_port }}/metrics"
        method: GET
        status_code: 200
        return_content: true

    - name: "Ensure that Logcli is installed and able to run"
      register: loki_logcli
      failed_when: loki_logcli.rc != 0
      changed_when: false
      ansible.builtin.command:
        cmd: logcli --version

    - name: "Check Logcli version"
      ansible.builtin.assert:
        that: "'version {{ loki_version }}' in loki_logcli.stderr"
        success_msg: "logcli version {{ loki_version }} is installed and working"
        fail_msg: "logcli version {{ loki_version }} is not installed or not working correctly"
