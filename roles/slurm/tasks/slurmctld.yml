---
- name: Create slurm state directory
  ansible.builtin.file:
    path: "{{ __slurm_config_merged.StateSaveLocation }}"
    owner: "{{ slurm_user_name }}"
    group: "{{ slurm_group_name }}"
    mode: "0700"
    state: directory
  when:
    - slurm_create_dirs
    - __slurm_config_merged.StateSaveLocation is defined

- name: Create slurm log directory
  ansible.builtin.file:
    path: "{{ __slurm_config_merged.SlurmctldLogFile | dirname }}"
    owner: "{{ slurm_user_name }}"
    group: "{{ slurm_group_name }}"
    mode: "0755"
    state: directory
  when:
    - slurm_create_dirs
    - __slurm_config_merged.SlurmctldLogFile is defined

- name: Include extra config creation tasks
  ansible.builtin.include_tasks: _inc_extra_configs.yml

- name: Install JWT key
  ansible.builtin.include_tasks: jwt.yml
  when: slurm_enable_jwt | bool

- name: Create systemd service file
  ansible.builtin.template:
    src: slurmctld.service.j2
    dest: /etc/systemd/system/slurmctld.service
    owner: root
    group: root
    mode: "0644"
