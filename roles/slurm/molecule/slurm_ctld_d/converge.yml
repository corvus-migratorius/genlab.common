---
- name: Converge for controller and compute node daemons
  hosts: all
  vars:
    slurm_roles: ['controller', 'exec']
    slurm_create_user: true
    slurm_config:
      MetricsType: metrics/openmetrics
    slurm_cgroup_config:
      CgroupPlugin: autodetect
      ConstrainCores: yes
      ConstrainDevices: yes
    slurm_munge_key: molecule/munge.key

  roles:
    - role: genlab.slurm
      become: true
