---
- name: Converge for controller and compute node daemons
  hosts: all
  vars:
    slurm_roles: ["controller"]
    slurm_create_user: true
    slurm_config:
      MetricsType: metrics/openmetrics
    slurm_cgroup_config:
      CgroupPlugin: autodetect
      ConstrainCores: true
      ConstrainDevices: true
    slurm_munge_key: files/munge.key
    slurm_enable_jwt: true
    slurm_jwt_key_source: files/jwt_hs256.key

  roles:
    - role: genlab.common.slurm
      become: true
